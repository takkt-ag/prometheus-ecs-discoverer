[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "prometheus-ecs-discoverer"
version = "3.3.3"
description = "Prometheus Service Discovery for AWS ECS"
authors = ["Tim Schwenke <tim.and.trallnag+code@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/trallnag/prometheus-ecs-discoverer"
keywords = ["prometheus", "discovery", "aws", "ecs", "metrics"]

[tool.poetry.dependencies]
python = "^3.14"
boto3 = "^1.16.00"
prometheus-client = "^0.8.0"
loguru = "^0.5.3"
prettyprinter = "^0.18.0"
dynaconf = "^3.1.2"
setuptools = "^69.0.0"

[[tool.poetry.source]]
name = "nexus"
url = "https://nexus.shared.ecom.kkeu.de/repository/pypi-proxy/simple/"
priority = "primary"


[tool.poetry.group.dev.dependencies]
poetry = "^2.3.2"
pytest = "^6.1"
flake8 = "^3.8"
black = "^20.8b1"
requests = "^2.24"
pytest-cov = "^2.10"
moto = {extras = ["ec2", "ecs"], version = "^4.0"}
rope = "^0.17"
isort = "^5.6"
pdoc3 = "^0.9.1"


[tool.black]
line-length = 90
exclude = '''
(
  /(
      \.venv
    | \.poetry-config
    | \.poetry-cache
    | __pycache__
    | \.git
  )/
  | tests/test_discovery_integration_data\.py
)
'''
